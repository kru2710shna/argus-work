# Local, machine-specific paths. Not meant to be identical across dev machines.

# Root of the rsynced EarthLoc data (https://github.com/gmberton/EarthLoc). Read-only,
# owned by root on this machine, do not expect write access here.
data_root: /mnt/sdc1/astroloc/data
queries_dir: /mnt/sdc1/astroloc/data/queries
database_dir: /mnt/sdc1/astroloc/data/database
earthloc_checkpoint: /mnt/sdc1/astroloc/data/best_trained_model.pt
queries_intersections_path: /mnt/sdc1/astroloc/data/queries_intersections_with_db_2021.pt

# Local weights for the zero-shot retriever comparisons. Nothing downloads these
# automatically; put them in place by hand (on the shared GPU workstation, only
# with the admin's OK, see README "Running on the shared GPU workstation").
remoteclip_checkpoint_dir: ./weights/RemoteCLIP        # holds RemoteCLIP-{RN50,ViT-B-32,ViT-L-14}.pt
qwen3vl_embedding_dir: ./weights                        # holds Qwen3-VL-Embedding-2B/ (and -8B/) HF snapshots

# Local scratch space for built indexes, cached descriptors, and demo outputs.
cache_dir: ./cache
output_dir: ./output
